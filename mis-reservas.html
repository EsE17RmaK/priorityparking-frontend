<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas - ParkingU</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/mis-reservas.css">
</head>
<body>
    <header class="top-nav">
        <div class="logo">ParkingU</div>
        <div class="user-profile">
            <span class="avatar">JP</span>
            <span class="user-name" id="userNameLabel">Estudiante</span>
            <button id="btnCerrarSesion" class="btn-logout">Salir</button>
        </div>
    </header>

    <div class="layout-container">
        <aside class="sidebar">
            <nav>
                <a href="dashboard.html" class="nav-item">Dashboard</a>
                <a href="reserva.html" class="nav-item">Nueva reserva</a>
                <a href="mis-reservas.html" class="nav-item active">Mis reservas</a>
                <a href="prioridad.html" class="nav-item">Mi prioridad</a>
                <a href="historial.html" class="nav-item">Historial</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="top-action-bar">
                <a href="dashboard.html" class="btn-retroceder">
                    &larr; Volver al Menú Principal
                </a>
            </div>

            <div class="reservas-card">
                <div class="tabs-header">
                    <button class="tab-btn active" id="tabProximas">Próximas</button>
                    <button class="tab-btn" id="tabAnteriores">Anteriores</button>
                </div>

                <div id="listaReservasContainer">
                    <p style="color: #64748b; text-align: center; padding: 2rem;">Cargando tus reservas...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="js/mis-reservas.js"></script>
</body>
</html>
