<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Garita - PriorityParking</title>
    <link rel="stylesheet" href="css/garita.css">
</head>
<body>
    <div class="container">
        <div class="garita-header">
            <h2>👮 Control de Garita - Sede Lima Centro</h2>
            <button id="btnCerrarSesion" type="button" class="btn-logout">Cerrar Sesión</button>
        </div>

        <div id="globalAlert" class="alert hidden"></div>

        <!-- RESUMEN DE AFORO EN TIEMPO REAL -->
        <div class="kpi-row">
            <div class="kpi-box">
                <span class="kpi-title">Aforo Mensual</span>
                <strong class="kpi-val" id="garitaCapacidad">--</strong>
            </div>
            <div class="kpi-box kpi-red">
                <span class="kpi-title">Ocupados Planta</span>
                <strong class="kpi-val" id="garitaOcupados">--</strong>
            </div>
            <div class="kpi-box kpi-amber">
                <span class="kpi-title">Esperados Hoy</span>
                <strong class="kpi-val" id="garitaEsperados">--</strong>
            </div>
            <div class="kpi-box kpi-gray">
                <span class="kpi-title">Bloqueados Hoy</span>
                <strong class="kpi-val" id="garitaBloqueados">--</strong>
            </div>
            <div class="kpi-box kpi-green">
                <span class="kpi-title">Disponibles Hoy</span>
                <strong class="kpi-val" id="garitaDisponibles">--</strong>
            </div>
        </div>

        <div class="grid-layout">
            <!-- PANEL 1: INGRESO VEHICULAR SIN SLOT -->
            <div class="panel-box">
                <h3>📥 Validar Ingreso Vehicular</h3>
                <div class="form-group">
                    <label for="codigo_alumno">Código de Alumno (o lectura QR)</label>
                    <input type="text" id="codigo_alumno" placeholder="Ej: U20304050">
                </div>
                <button id="btnRegistrarIngreso" type="button">Validar e Ingresar (+1 Ocupado)</button>
            </div>

            <!-- PANEL 2: BLOQUEO OPERATIVO DIARIO POR CONTINGENCIA -->
            <div class="panel-box">
                <h3>🚧 Bloqueo Operativo del Día</h3>
                <div class="form-group">
                    <label for="cupos_bloqueados">Cantidad de lugares a bloquear hoy</label>
                    <input type="number" id="cupos_bloqueados" min="0" max="500" placeholder="Ej: 10">
                </div>
                <div class="form-group">
                    <label for="motivo_bloqueo">Motivo (mantenimiento, evento, etc.)</label>
                    <input type="text" id="motivo_bloqueo" placeholder="Ej: Evento institucional en patio">
                </div>
                <button id="btnGuardarBloqueo" type="button" class="btn-warning">Aplicar Bloqueo Diario</button>
            </div>
        </div>

        <div class="monitor-header">
            <h3>📋 Vehículos en Planta y Reservas de Hoy</h3>
            <button id="btnRefrescarMonitor" type="button" class="btn-secondary btn-sm">🔄 Refrescar</button>
        </div>
        <div id="monitorLista" class="lista-operativa"></div>
    </div>

    <script src="js/garita.js?v=2"></script>
</body>
</html>
